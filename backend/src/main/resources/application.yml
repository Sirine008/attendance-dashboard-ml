server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: assiduite-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5440/assiduite}
    username: ${DB_USER:assiduite}
    password: ${DB_PASSWORD:assiduite}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      # Pas de hibernate.jdbc.time_zone : les pointages sont des heures murales locales (TIMESTAMP sans fuseau).
      hibernate.jdbc.batch_size: 500
      hibernate.order_inserts: true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
